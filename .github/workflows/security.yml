name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一早上 8 点跑一次，抓新披露的漏洞
    - cron: '0 8 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '11'

jobs:
  # ============================================================
  # 密钥扫描：防止硬编码密钥被提交
  # ============================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # 依赖漏洞扫描
  # ============================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm audit（高危阻塞，中低危仅警告）
        run: |
          set +e
          pnpm audit --audit-level=high
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 发现高危依赖漏洞"
            exit 1
          fi

  # ============================================================
  # 汇总（用于分支保护）
  # ============================================================
  security-success:
    name: Security Success
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit]
    if: always()
    steps:
      - name: 检查所有 job 状态
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ] \
            || [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "❌ 安全扫描失败"
            exit 1
          fi
          echo "✅ 安全扫描通过"
