## ApisCloud EMQX 配置（开发环境）

node {
  name = "emqx@127.0.0.1"
  cookie = "apiscloud-emqx-secret"
  data_dir = "/opt/emqx/data"
}

listener.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listener.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1024000
}

listener.ssl.default {
  bind = "0.0.0.0:8883"
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

## 开发环境允许匿名连接，生产环境必须改
authorization {
  no_match = allow
  deny_action = ignore
}

log.console {
  level = warning
}
