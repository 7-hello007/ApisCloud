# =============================================================
# 层配置：声明每一层启用哪些服务
# 服务是逻辑单元，层是部署单元。加层只改本文件，服务代码零改动。
# =============================================================

version: '1'

# 当前阶段：单层，所有服务集中运行
# 未来扩展：解开下方注释，改成多层
layers:
  - name: single
    description: 单层部署，所有服务集中运行（当前阶段）
    services:
      - infra
      - gateway
      - plugin-host
      - libs
      - ingest
      - data-writer
      - simulator
      - dispatch-core
      - observability
      - registry

