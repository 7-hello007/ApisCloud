name: apiscloud-infra

networks:
  apiscloud:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  emqx_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: apiscloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-apiscloud}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-apiscloud}
      POSTGRES_DB: ${PG_DATABASE:-apiscloud}
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-apiscloud} -d ${PG_DATABASE:-apiscloud}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: apiscloud-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==================== EMQX ====================
  emqx:
    image: emqx/emqx:5.8.0
    container_name: apiscloud-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: apiscloud-emqx-secret
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: apiscloud
    ports:
      - "${MQTT_PORT:-11883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${MQTT_SSL_PORT:-8883}:8883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==================== Kafka (KRaft 单节点) ====================
  kafka:
    image: apache/kafka:3.7.0
    container_name: apiscloud-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      CLUSTER_ID: apiscloud-kraft-cluster
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ==================== Prometheus ====================
  # - --config.expand-env: 让 prometheus.yml 支持 ${VAR}
  # - environment: 把各服务端口传给容器，供 expand-env 使用
  # - extra_hosts: host.docker.internal 默认用 Docker 的 host-gateway
  #   如果宿主环境需要覆盖，在 shell 里 export HOST_IP=<ip> 即可
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: apiscloud-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:${HOST_IP:-host-gateway}"
    volumes:
      - ./monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== Loki ====================
  loki:
    image: grafana/loki:3.1.0
    container_name: apiscloud-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitor/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: apiscloud-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: apiscloud
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      TZ: Asia/Shanghai
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    extra_hosts:
      - "host.docker.internal:${HOST_IP:-host-gateway}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - apiscloud
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s